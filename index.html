<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOODEN HOME | Modern Furniture</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F7F3EB;
            color: #4B382A;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: white;
        }
        .hero {
    min-height: 450px;
    padding: 100px 20px;
    text-align: center;
    background: #EDE3D5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.hero h1 {
    font-size: 38px;
    color: #4B382A;
    margin-bottom: 20px;
    max-width: 700px;
}

.hero p {
    font-size: 17px;
    color: #7A6653;
    line-height: 1.7;
    max-width: 550px;
    margin-bottom: 30px;
}

.hero-btn {
    display: inline-block;
    background: #A47551;
    color: white;
    padding: 14px 28px;
    border-radius: 6px;
    text-decoration: none;
    transition: 0.3s ease;
}

.hero-btn:hover {
    background: #4B382A;
    transform: translateY(-3px);
} 

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #A47551;
        }

        .nav-links a {
            text-decoration: none;
            color: #4B382A;
            margin-left: 20px;
            font-size: 15px;
        }

    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">WOODEN HOME</div>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>

    </nav>
    <section class="hero" id="home">

    <h1>Discover Your Perfect Furniture</h1>

    <p>
        Elegant furniture designed to make
        your home more beautiful and comfortable.
    </p>

    <a href="#products" class="hero-btn">
        Explore Collection
    </a>

    </section>

</body>
</html>
